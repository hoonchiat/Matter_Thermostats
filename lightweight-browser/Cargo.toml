[package]
name = "litebrowser"
version = "0.1.0"
edition = "2021"
description = "A lightweight touch-screen HTML5 web browser for Linux, built on WebKitGTK"
license = "Apache-2.0"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same versions wry uses, for direct access to the GTK / WebKitGTK widgets.
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
