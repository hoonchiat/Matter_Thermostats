<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { color-scheme: light dark; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --muted: #9a9aa0; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    font: 18px system-ui, sans-serif; padding: 0 16px;
    background: Canvas; color: CanvasText;
  }
  h1 { font-weight: 600; font-size: 32px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 4px 0; }
</style>
</head>
<body>
  <div>
    <h1>LiteBrowser</h1>
    <p>Tap the address bar above to enter an address or a search.</p>
    <p>Swipe from the screen edge to go back or forward · pinch to zoom.</p>
  </div>
</body>
</html>
