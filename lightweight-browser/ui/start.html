<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { color-scheme: light dark; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --muted: #9a9aa0; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    font: 15px system-ui, -apple-system, "Segoe UI", sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-weight: 600; font-size: 28px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 4px 0; }
  kbd { font: 12px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--muted); border-radius: 4px; }
</style>
</head>
<body>
  <div>
    <h1>LiteBrowser</h1>
    <p>Type an address or a search in the bar above.</p>
    <p><kbd>Ctrl</kbd>+<kbd>L</kbd> address bar &nbsp; <kbd>F12</kbd> developer tools &nbsp; <kbd>Ctrl</kbd>+<kbd>+</kbd>/<kbd>-</kbd> zoom</p>
  </div>
</body>
</html>
