name: usb-nessum-adapter

# Host-side checks for the USB <-> Nessum adapter subproject: nessumctl tests
# against the protocol simulator, and a shell syntax check of the bring-up script.

on:
  push:
    branches: ["**"]
    paths: ["usb-nessum-adapter/**", ".github/workflows/usb-nessum-adapter.yml"]
  pull_request:
    paths: ["usb-nessum-adapter/**", ".github/workflows/usb-nessum-adapter.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tools:
    name: nessumctl + host scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nessumctl tests (against fake_adapter.py)
        working-directory: usb-nessum-adapter/host/tools
        run: python3 -m unittest -v

      - name: Shell syntax check
        run: sh -n usb-nessum-adapter/host/linux/check-adapter.sh
