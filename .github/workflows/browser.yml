name: LiteBrowser

# Checks for the lightweight-browser/ Rust project, a Linux (WebKitGTK)
# touch-screen browser: format, lint and unit tests on x86-64, plus a
# release build on arm64 (Raspberry Pi class boards) for public repos, where
# GitHub's arm64 runners are available.

on:
  push:
    branches: ["**"]
    paths: ["lightweight-browser/**", ".github/workflows/browser.yml"]
  pull_request:
    paths: ["lightweight-browser/**", ".github/workflows/browser.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lightweight-browser

jobs:
  x86_64:
    name: Lint + test (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lightweight-browser
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  arm64:
    name: Build + test (arm64)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lightweight-browser
      - run: cargo test
      - run: cargo build --release
