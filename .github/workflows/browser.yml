name: LiteBrowser

# Checks for the lightweight-browser/ Rust project, a Linux (WebKitGTK)
# touch-screen browser: format, lint and unit tests, plus downloadable
# x86-64 and arm64 (Raspberry Pi class boards) binaries.

on:
  push:
    branches: ["**"]
    paths: ["lightweight-browser/**", ".github/workflows/browser.yml"]
  pull_request:
    paths: ["lightweight-browser/**", ".github/workflows/browser.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lightweight-browser

jobs:
  x86_64:
    name: Lint + test (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lightweight-browser
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Downloadable binaries (Actions run page -> Artifacts). Built on Ubuntu
  # 22.04 so they also run on older distros (glibc >= 2.35), e.g. Raspberry
  # Pi OS Bookworm and Debian 12. The device only needs libwebkit2gtk-4.1-0.
  binaries:
    name: Binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          # Free for public repositories; a private repo needs a paid plan.
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lightweight-browser
      - run: cargo test
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/litebrowser
          cp target/release/litebrowser README.md TESTING.md dist/litebrowser/
          cp -r examples tools dist/litebrowser/
          tar -C dist -czf litebrowser-linux-${{ matrix.arch }}.tar.gz litebrowser
      - uses: actions/upload-artifact@v4
        with:
          name: litebrowser-linux-${{ matrix.arch }}
          path: lightweight-browser/litebrowser-linux-${{ matrix.arch }}.tar.gz
