# Managed component dependencies (pulled by the IDF Component Manager on first build).
# The SSD1306 panel driver ships built into ESP-IDF's esp_lcd component
# (esp_lcd_panel_ssd1306.h) as of IDF v5.3+, so no managed component is needed;
# ui_oled just PRIV_REQUIRES esp_lcd. (The previously listed managed component
# espressif/esp_lcd_ssd1306 does not exist in the registry.)
dependencies:
  # Pre-built Matter core (CHIP libs) — avoids a connectedhomeip source build.
  espressif/esp_matter:
    version: ">=1.4.0"
  espressif/mdns:
    version: ">=1.0.0"
  # (Optional) LVGL port if a richer UI is desired later:
  # lvgl/lvgl: "^8.3.0"
  # esp_lvgl_port: "^1.4.0"
  idf:
    version: ">=5.2.0"
