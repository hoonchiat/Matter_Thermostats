#
# Matter temperature sensor for the Pro Micro / SuperMini nRF52840.
#
# SPDX-License-Identifier: LicenseRef-Nordic-5-Clause
#
# Common defaults come from the shared Matter Kconfig.defaults; this file only
# carries what is specific to this app or overrides a default.

# ---- Matter core --------------------------------------------------------
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_STD_CPP17=y

# Vendor/Product ID. 0xFFF1 / 0x8000 pair with the built-in test DAC used when
# factory data is disabled (see below).
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Start advertising for Matter commissioning automatically on boot.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
# Extended announcement, 1 hour window.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

CONFIG_BT_DEVICE_NAME="MHTempSensor"
CONFIG_THREAD_NAME=y

# BLE controller (nRF SoftDevice Controller) for commissioning. The board
# Kconfig.defconfig also defaults this on, but set it explicitly so the
# zephyr,bt-hci = &bt_hci_sdc device is always built.
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SOFTDEVICE=y

# ---- User interface (LED + external button via the shared board module) --
CONFIG_DK_LIBRARY=y

# ---- Temperature sensor: SAADC + thermistor -----------------------------
CONFIG_ADC=y
CONFIG_GPIO=y

# ---- Sleepy End Device power management ----------------------------------
# Suspend peripheral devices when the CPU sleeps.
CONFIG_PM_DEVICE=y

# ---- Clock: use the internal RC 32k source -------------------------------
# Robust across SuperMini variants (many lack the 32.768 kHz crystal). If YOUR
# board has an LFXO crystal, switch to CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# for better SED battery life.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ---- Commissioning: test DAC + per-device provisioning -------------------
# We keep the built-in test DAC (VID 0xFFF1 / PID 0x8000, which the hub accepts)
# and do NOT use NCS factory data (CONFIG_CHIP_FACTORY_DATA). Instead a custom
# CommissionableDataProvider (src/provisioning.cpp) reads {discriminator,
# passcode, serial} from the `factory` flash partition and computes the SPAKE2+
# verifier on-device - the same on-device-verifier scheme as the ESP32
# light/button, so one browser tool provisions every device. A blank partition
# falls back to the test setup code 20202021 / discriminator 3840.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n

# flash_area API to read the `factory` provisioning partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Disable NFC commissioning.
CONFIG_CHIP_NFC_COMMISSIONING=n

# ---- Diagnostics / shell (handy during bring-up over USB CDC) -------------
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# ---- Size / misc ---------------------------------------------------------
CONFIG_USE_SEGGER_RTT=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_MPU_STACK_GUARD=y

# No MCUboot on the UF2 image -> OTA cannot apply updates, so drop the OTA
# requestor to save flash (the app must fit the 796K UF2 code partition).
CONFIG_CHIP_OTA_REQUESTOR=n

# Tell Matter there is no bootloader (UF2 loads the app directly). Without this
# the CHIP_BOOTLOADER choice defaults to MCUBOOT, which pulls in the DFU image
# manager (flash_img.c) that needs partition-manager symbols we don't have.
CONFIG_CHIP_BOOTLOADER_NONE=y
