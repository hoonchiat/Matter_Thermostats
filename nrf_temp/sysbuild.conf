SB_CONFIG_MATTER=y

# Single-image UF2 build: no MCUboot (the Adafruit UF2 bootloader on the board
# loads the app directly at 0x26000), and no factory-data generation (the app
# uses built-in test commissioning credentials).
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n

# No OTA: sysbuild otherwise forces CONFIG_CHIP_OTA_REQUESTOR=y into the image
# (nrf/sysbuild/CMakeLists.txt), which needs MCUboot/partition-manager symbols.
SB_CONFIG_MATTER_OTA=n
